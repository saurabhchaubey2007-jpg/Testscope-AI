[tool.poetry]
name = "testscope-ai"
version = "0.1.0"
description = "Autonomous software testing agent - Phase 1"
authors = ["TestScope Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.142.2"
uvicorn = "^0.54.0"
pydantic = "^2.13.5"
pydantic-settings = "^2.15.0"
sqlalchemy = "^2.1.3"
psycopg2-binary = "^2.9.13"
langchain = "^1.4.3"
langgraph = "^1.2.12"
langchain-google-genai = "^4.4.0"
langchain-groq = "^1.1.3"
pytest = "^9.1.1"
httpx = "^0.28.1"
python-dotenv = "^1.2.4"
bcrypt = "^5.0.0"
PyJWT = "^2.15.1"
alembic = "^1.20.0"
email-validator = "^2.3.0"
pytest-playwright = "^0.9.0"

[tool.poetry.group.dev.dependencies]
pytest-asyncio = "^1.4.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["apps/api/tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
