[tool.poetry]
name = "testscope-ai"
version = "0.1.0"
description = "Autonomous software testing agent - Phase 1"
authors = ["TestScope Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.35"
psycopg2-binary = "^2.9.9"
langchain = "^0.3.0"
langgraph = "^0.2.25"
langchain-google-genai = "^1.0.10"
langchain-groq = "^0.2.0"
pytest = "^8.3.3"
httpx = "^0.27.2"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
